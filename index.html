<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Монитор статусов</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center justify-center p-4 space-y-6">

    <div class="w-full max-w-xl flex justify-end">
        <button onclick="loginWithGoogle()" class="flex items-center space-x-2 bg-white hover:bg-gray-50 text-gray-700 font-medium py-2 px-4 rounded-xl shadow-sm border border-gray-200 cursor-pointer transition">
            <svg class="w-5 h-5" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
            </svg>
            <span>Войти через Google</span>
        </button>
    </div>

    <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-6 w-full max-w-xl">
        <h2 class="text-xl font-bold text-gray-900 mb-2">Мой профиль</h2>
        <p class="text-gray-600 mb-4">Вы зашли как: <span id="current-user" class="font-semibold text-gray-800">Загрузка...</span></p>
        
        <div class="grid grid-cols-2 gap-3">
            <button onclick="changeStatus('📚 Учусь', '#1e9242')" class="bg-[#1e9242] hover:opacity-90 text-white font-medium py-3 px-4 rounded-xl shadow-sm border border-black/10 cursor-pointer transition">📚 Учусь</button>
            <button onclick="changeStatus('☕ Кофе-брейк', '#ffcc00')" class="bg-[#ffcc00] hover:opacity-90 text-black font-medium py-3 px-4 rounded-xl shadow-sm border border-black/10 cursor-pointer transition">☕ Кофе</button>
            <button onclick="changeStatus('🎮 В игре', '#179cb3')" class="bg-[#179cb3] hover:opacity-90 text-white font-medium py-3 px-4 rounded-xl shadow-sm border border-black/10 cursor-pointer transition">🎮 В игре</button>
            <button onclick="changeStatus('🏠 Дома', '#64748b')" class="bg-[#64748b] hover:opacity-90 text-white font-medium py-3 px-4 rounded-xl shadow-sm border border-black/10 cursor-pointer transition">🏠 Дома</button>
        </div>
    </div>

    <div class="bg-white rounded-2xl shadow-sm border border-gray-200 p-6 w-full max-w-xl">
        <h2 class="text-xl font-bold text-gray-900 mb-4">Монитор группы</h2>
        <div id="group-container" class="space-y-4">
            <p class="text-gray-400 text-sm">Загрузка пользователей...</p>
        </div>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm'

        const URL = 'https://pkllhpwpyznbmirhwzec.supabase.co';
        const KEY = 'sb_publishable_jh6KIEbCx9RI3QwrVU_EDQ_-ezVsgzC'; 
        const supabase = createClient(URL, KEY);

        const MY_ID = '9a32646f-c9f4-49a6-8cca-98de1edf1d3d'; 

      // ФУНКЦИЯ ДЛЯ ВХОДА ЧЕРЕЗ GOOGLE
window.loginWithGoogle = async () => {
    const { error } = await supabase.auth.signInWithOAuth({
        provider: 'google',
        options: {
            // Явно указываем адрес твоего GitHub Pages для возврата
            redirectTo: 'https://roman6557.github.io/roman-3kurs/'
        }
    });
    if (error) console.error("Ошибка авторизации:", error.message);
};

        // Функция изменения статуса
        window.changeStatus = async (text, color) => {
            const { error } = await supabase
                .from('Roman') 
                .update({ status: text, color: color })
                .eq('id', MY_ID);

            if (error) {
                alert("Ошибка! Проверьте RLS политики в Supabase.");
                console.error(error);
            } else {
                fetchGroup(); 
            }
        };

        // Функция получения данных всех участников
        async function fetchGroup() {
            const { data, error } = await supabase
                .from('Roman') 
                .select('*')
                .order('username', { ascending: true });

            if (error) {
                console.error("Ошибка получения данных:", error);
                return;
            }

            const container = document.getElementById('group-container');
            container.innerHTML = ''; 

            data.forEach(profile => {
                if (profile.id === MY_ID) {
                    document.getElementById('current-user').innerText = profile.username;
                }

                const userRow = document.createElement('div');
                userRow.className = "flex items-start space-x-3 pt-2 pb-2 border-b border-gray-100 last:border-0";
                
                userRow.innerHTML = `
                    <span class="w-2.5 h-2.5 rounded-full mt-1.5 shrink-0" style="background-color: ${profile.color || '#ccc'}"></span>
                    <div>
                        <div class="font-bold text-gray-950 text-base leading-tight">${profile.username}</div>
                        <div class="text-sm text-gray-500 mt-0.5">${profile.status || 'Нет статуса'}</div>
                    </div>
                `;
                container.appendChild(userRow);
            });
        }

        // Запуск при старте страницы
        fetchGroup();
    </script>
</body>
</html>
